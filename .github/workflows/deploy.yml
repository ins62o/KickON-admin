name: Verify and deploy KICKON administrator
on:
  push:
    branches: [Prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kickon-admin-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_PAGER: ''
      KICKON_ENVIRONMENT: production
      KICKON_LOGIN_ENVIRONMENT: development
      NEXT_PUBLIC_KICKON_DEVELOPMENT_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_KICKON_DEVELOPMENT_SUPABASE_URL }}
      NEXT_PUBLIC_KICKON_DEVELOPMENT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_KICKON_DEVELOPMENT_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_KICKON_PRODUCTION_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_KICKON_PRODUCTION_SUPABASE_URL }}
      NEXT_PUBLIC_KICKON_PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_KICKON_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SPORTSMONKS_API_ALLOWANCE: ${{ vars.NEXT_PUBLIC_SPORTSMONKS_API_ALLOWANCE }}
      VITE_ADMIN_API_BASE_URL: https://smihjaucucffmsbktnmp.supabase.co/functions/v1/kickon-admin-api
      SITE_URL: ${{ vars.ADMIN_SITE_URL }}
      S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      ROUTING_FUNCTION: ${{ vars.AWS_CLOUDFRONT_FUNCTION_NAME }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify and build the current Vite application
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run lint
          npm run build
          node scripts/verify-deploy-artifact.mjs
          node -e 'require("fs").writeFileSync("dist/build-info.json",JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID}))'
      - name: Verify private API before publishing the UI
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 30 -H "Origin: $SITE_URL" -H 'Content-Type: application/json' -d '{"environment":"production"}' -o "$RUNNER_TEMP/api-boundary.json" -w '%{http_code}' "$VITE_ADMIN_API_BASE_URL/system-metrics")"
          test "$status" = 401
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Preserve previous entry and upload assets first
        run: |
          set -euo pipefail
          test -n "$S3_BUCKET"
          test -n "$DISTRIBUTION_ID"
          test -n "$ROUTING_FUNCTION"
          aws s3 cp "s3://$S3_BUCKET/index.html" "s3://$S3_BUCKET/releases/$GITHUB_RUN_ID/index.html" --only-show-errors
          aws s3 sync dist/assets/ "s3://$S3_BUCKET/assets/" --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          aws s3 sync dist/ "s3://$S3_BUCKET/" --exclude 'assets/*' --exclude 'index.html' --cache-control 'no-cache,max-age=0,must-revalidate' --only-show-errors
      - name: Publish SPA routing and the new entry
        run: |
          set -euo pipefail
          aws cloudfront describe-function --name "$ROUTING_FUNCTION" --stage DEVELOPMENT > "$RUNNER_TEMP/routing-before.json"
          jq '.FunctionSummary.FunctionConfig' "$RUNNER_TEMP/routing-before.json" > "$RUNNER_TEMP/routing-config.json"
          etag="$(jq -r .ETag "$RUNNER_TEMP/routing-before.json")"
          aws cloudfront update-function --name "$ROUTING_FUNCTION" --if-match "$etag" --function-config "file://$RUNNER_TEMP/routing-config.json" --function-code fileb://infrastructure/cloudfront/viewer-request.js > "$RUNNER_TEMP/routing-update.json"
          etag="$(jq -r .ETag "$RUNNER_TEMP/routing-update.json")"
          aws cloudfront publish-function --name "$ROUTING_FUNCTION" --if-match "$etag" > /dev/null
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" --content-type 'text/html' --cache-control 'no-cache,max-age=0,must-revalidate' --only-show-errors
          id="$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"
      - name: Verify published entry and hashed assets
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --compressed --max-time 30 "$SITE_URL/" -o "$RUNNER_TEMP/published.html"
          cmp dist/index.html "$RUNNER_TEMP/published.html"
          asset="$(node -e 'const html=require("fs").readFileSync("dist/index.html","utf8");process.stdout.write(html.match(/src="(\/assets\/[^\"]+\.js)"/)[1])')"
          curl --fail --silent --show-error --compressed --max-time 30 "$SITE_URL$asset" -o "$RUNNER_TEMP/published.js"
          cmp "dist$asset" "$RUNNER_TEMP/published.js"
          echo "Deployed $GITHUB_SHA to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
