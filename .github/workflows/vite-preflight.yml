name: Vite deployment preflight
on:
  push:
    branches: [codex/vite-deploy-20261020]
    paths: [.github/workflows/vite-preflight.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Inspect existing runtime without printing secrets
        env:
          DEVELOPMENT_FUNCTION: ${{ vars.AWS_DEVELOPMENT_ADMIN_API_LAMBDA_FUNCTION_NAME }}
          PRODUCTION_FUNCTION: ${{ vars.AWS_PRODUCTION_ADMIN_API_LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          for function in "$DEVELOPMENT_FUNCTION" "$PRODUCTION_FUNCTION"; do
            aws lambda get-function-configuration --function-name "$function" --output json > "$RUNNER_TEMP/runtime.json"
            jq '{FunctionName,Runtime,Handler,Timeout,role_environment:.Environment.Variables.KICKON_ENVIRONMENT,configuration_keys:(.Environment.Variables|keys)}' "$RUNNER_TEMP/runtime.json"
            rm "$RUNNER_TEMP/runtime.json"
          done
